name: Soil and Rotation source validation

on:
  push:
    branches:
      - main
      - feature/soil-source-fusion-ny-usda-v2
  pull_request:

permissions:
  contents: read

jobs:
  soil-source-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FieldShift_v7_Calendar_Sprite
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FieldShift_v7_Calendar_Sprite/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run soil-source offline tests
        run: python -m unittest discover -s tests -p 'test_soil*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q soil_rotation_api.py soil_context_api.py prism_reference.py
