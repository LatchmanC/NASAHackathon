name: Soil and Rotation source validation

on:
  push:
    branches:
      - main
      - feature/soil-source-fusion-ny-usda-v2
  pull_request:

permissions:
  contents: read

jobs:
  soil-source-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FieldShift_v7_Calendar_Sprite
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FieldShift_v7_Calendar_Sprite/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run soil-source offline tests
        run: python -m unittest discover -s tests -p 'test_soil*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q soil_rotation_api.py soil_context_api.py prism_reference.py
      - name: Farm cloud API regression tests
        run: python -m unittest discover -s tests -p 'test_farm_profile_api.py' -v
      - name: Check frontend JavaScript syntax and cloud sync behavior
        run: |
          node --check public/static/soil-rotation.js
          node --check public/static/app.js
          node --test tests/test_farm_cloud_frontend.cjs
      - name: Check farm profile backend syntax
        run: python -m compileall -q farm_profile_api.py
      - name: Live USDA point diagnostic (non-blocking)
        continue-on-error: true
        run: |
          python - <<'PY'
          import soil_rotation_api as soil
          for lat,lon in [(42.4439,-76.5019),(42.916,-77.512)]:
              try:
                  result=soil._query_usda(lat,lon)
                  profile=result.get("profile") or {}
                  print("point",lat,lon,"status",result.get("status"),
                        "drainage",profile.get("drainage_class"),
                        "mapunit",profile.get("mapunit_name"),
                        "method",result.get("lookup_method"))
              except Exception as exc:
                  print("USDA live probe failed at",lat,lon,
                        "reason",type(exc).__name__,str(exc)[:180])
          PY
